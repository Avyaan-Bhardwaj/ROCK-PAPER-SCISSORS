<html>
<head>
<style>
.a1{font-size:50px;background-color:#FFFFFF;border:none}
.a2{font-size:50px;background-color:#FFFFFF;border:none}
.a3{font-size:50px;background-color:#FFFFFF;border:none}
.a1:hover{font-size:65px}
.a2:hover{font-size:65px}
.a3:hover{font-size:65px}
</style>
</head>
<body>
<center>
<div class="container" style="border:5px solid #000000;border-radius:10px;width:500px;height:375px"><h1>Rock 🪨 Paper 📄 Scissors ✂️</h1>
<pre class="scoreboard" style="font-size:17.5px;font-family:'Times New Roman', Times, serif">👤You: <span id="user-score">0</span>                                   💻Computer: <span id="computer-score">0</span></pre>
<div class="choices">
<button class="a1" id="Rock">✊</button>
<button class="a2" id="Paper">✋</button>
<button class="a3" id="Scissors">✌️</button>
</div>
<h1 id="result">Make your move!</h1>
<button id="reset" style="width:150px;height:30px;border-radius:10px;background-color:#6666FF;">🔁Reset Game</button>
</div>
<script>
const userScoreSpan = document.getElementById('user-score');
const computerScoreSpan = document.getElementById('computer-score');
const resultDiv = document.getElementById('result');
const rockBtn = document.getElementById('Rock');
const paperBtn = document.getElementById('Paper');
const scissorsBtn = document.getElementById('Scissors');
const resetBtn = document.getElementById('reset');

let userScore = 0;
let computerScore = 0;

rockBtn.onclick =()=> playGame('Rock');
paperBtn.onclick =()=> playGame('Paper');
scissorsBtn.onclick =()=> playGame('Scissors');
resetBtn.onclick = resetGame;

function playGame(userChoice) {
    const computerChoice = getComputerChoice();
    const winner = checkWinner(userChoice, computerChoice);
    if (winner === 'user') {
        userScore++;
        resultDiv.innerHTML = `You Win! ${userChoice} beats ${computerChoice}.`;
    } else if (winner === 'computer') {
    computerScore++;
    resultDiv.innerHTML = `Computer Wins! ${computerChoice} beats ${userChoice}.`;
    } else {
    resultDiv.innerHTML = `It's a Draw! You both chose ${userChoice}.`;
    }

    updateScores();
}


function getComputerChoice() {
    const choices = ['Rock', 'Paper', 'Scissors'];
    return choices[Math.floor(Math.random() * choices.length)]
}

function checkWinner(user, computer) {
    if (user === computer) return 'draw';
    if (
      (user === 'Rock' && computer === 'Scissors') ||
      (user === 'Paper' && computer === 'Rock') ||
      (user === 'Scissors' && computer === 'Paper')
    ) {
      return 'user';
    }
    return 'computer' 
}

function updateScores() {
    userScoreSpan.textContent = userScore;
    computerScoreSpan.textContent = computerScore;
}








function resetGame() {
    userScore = 0;
    computerScore = 0;
    updateScores();
    resultDiv.textContent = 'Make your move!';
}

</script>
</center>
</body>
</html>
